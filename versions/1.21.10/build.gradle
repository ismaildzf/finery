plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.1-neoforge+1.21.10'
group = 'net.developer.finery'
base { archivesName = 'finery' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = '21.10.64'

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Dfinery.selftest=true'
        }
    }

    mods {
        finery { sourceSet sourceSets.main }
    }
}

repositories {
    mavenLocal()
}

dependencies {
    implementation files('libs/curios-neoforge-13.0.0+1.21.10.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}
