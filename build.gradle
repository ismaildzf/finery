plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0-neoforge'
group = 'net.developer'

base {
    archivesName = 'finery'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
    maven { name = 'WispForest'; url = 'https://maven.wispforest.io/releases' }
    maven { name = 'Su5ed'; url = 'https://maven.su5ed.dev/releases' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.neoforged:forge:1.20.1-47.1.106'
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
}
