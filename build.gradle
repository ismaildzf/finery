plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = '1.0.3-neoforge+1.20.1'
group = 'net.developer'

base {
    archivesName = 'finery'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run-server')
            args '--nogui'
        }
    }
}

repositories {
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'Curios'; url = 'https://maven.theillusivec4.top/' }
    maven { name = 'WispForest'; url = 'https://maven.wispforest.io/releases' }
    maven { name = 'Su5ed'; url = 'https://maven.su5ed.dev/releases' }
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.neoforged:forge:1.20.1-47.1.106'
    implementation fg.deobf('top.theillusivec4.curios:curios-forge:5.14.1+1.20.1')
}

mixin {
    add sourceSets.main, 'finery.refmap.json'
    config 'finery.mixins.json'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest.attributes([
            'MixinConfigs': 'finery.mixins.json',
            'Implementation-Title': 'Finery',
            'Implementation-Version': project.version
    ])
}
